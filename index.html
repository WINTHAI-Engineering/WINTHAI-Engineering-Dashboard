<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบลงเวลาเข้า-ออกงาน</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      background: linear-gradient(135deg, #eaf2ff, #f7f9fc);
      color: #1d2939;
      font-family: Arial, "Segoe UI", Tahoma, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 26px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(16, 24, 40, .12);
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 25px;
      color: #155eef;
    }

    .subtitle {
      margin: 10px 0 24px;
      text-align: center;
      color: #667085;
      font-size: 14px;
    }

    .consent {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 14px;
      border: 1px solid #fedf89;
      border-radius: 12px;
      background: #fffaeb;
      font-size: 13px;
      line-height: 1.6;
      color: #7a2e0e;
    }

    .consent input {
      width: 20px;
      height: 20px;
      margin: 2px 0 0;
      flex-shrink: 0;
      cursor: pointer;
    }

    .consent label {
      margin: 0;
      cursor: pointer;
      font-weight: normal;
    }

    label.field-label {
      display: block;
      margin: 18px 0 7px;
      font-size: 14px;
      font-weight: 700;
      color: #344054;
    }

    input[type="text"],
    select,
    button {
      width: 100%;
      min-height: 50px;
      border-radius: 11px;
      font-size: 16px;
    }

    input[type="text"],
    select {
      padding: 12px 14px;
      border: 1px solid #d0d5dd;
      outline: none;
      background: #fff;
      color: #1d2939;
    }

    input[type="text"]:focus,
    select:focus {
      border-color: #155eef;
      box-shadow: 0 0 0 4px rgba(21, 94, 239, .12);
    }

    input[type="text"]:disabled,
    select:disabled {
      background: #f2f4f7;
      color: #98a2b3;
      cursor: not-allowed;
    }

    .step {
      margin: 26px 0 9px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eaecf0;
      font-size: 15px;
      font-weight: 700;
      color: #475467;
    }

    button {
      padding: 12px 16px;
      border: 0;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      transition: filter .2s, transform .1s;
    }

    button:hover:not(:disabled) {
      filter: brightness(.96);
    }

    button:active:not(:disabled) {
      transform: scale(.99);
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .blue { background: #155eef; }
    .gray { background: #475467; }
    .green { background: #039855; }

    .info,
    .status,
    .result {
      margin-top: 11px;
      padding: 13px;
      border-radius: 11px;
      font-size: 13px;
      line-height: 1.6;
    }

    .info {
      background: #eff8ff;
      color: #175cd3;
    }

    .status {
      display: none;
    }

    .status.success {
      display: block;
      background: #ecfdf3;
      color: #027a48;
    }

    .status.error {
      display: block;
      background: #fef3f2;
      color: #b42318;
    }

    .status.loading {
      display: block;
      background: #fffaeb;
      color: #b54708;
    }

    #video,
    #photo {
      display: none;
      width: 100%;
      margin-top: 12px;
      border-radius: 12px;
      background: #101828;
    }

    #video {
      max-height: 420px;
      object-fit: cover;
    }

    .map-link {
      display: none;
      margin-top: 10px;
      color: #155eef;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }

    .map-link:hover {
      text-decoration: underline;
    }

    .result {
      display: none;
      border: 1px solid #abefc6;
      background: #f6fef9;
      color: #027a48;
    }

    .note {
      margin-top: 10px;
      color: #667085;
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .container {
        padding: 18px;
        border-radius: 16px;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <h1>ระบบลงเวลาเข้า-ออกงาน</h1>
    <p class="subtitle">กรอกข้อมูล รับตำแหน่ง และถ่ายรูปก่อนบันทึกเวลา</p>

    <div class="consent">
      <input type="checkbox" id="consent">
      <label for="consent">
        ฉันยินยอมให้ระบบเข้าถึงตำแหน่ง GPS และกล้อง
        เพื่อใช้ยืนยันการลงเวลาทำงาน
      </label>
    </div>

    <label class="field-label" for="employeeId">รหัสพนักงาน</label>
    <input id="employeeId" type="text" placeholder="เช่น EMP001" disabled>

    <label class="field-label" for="employeeName">ชื่อ-นามสกุล</label>
    <input id="employeeName" type="text" placeholder="กรอกชื่อ-นามสกุล" disabled>

    <label class="field-label" for="action">ประเภทการลงเวลา</label>
    <select id="action" disabled>
      <option value="เข้างาน">เข้างาน</option>
      <option value="ออกงาน">ออกงาน</option>
    </select>

    <div class="step">ขั้นตอนที่ 1: ตรวจสอบตำแหน่ง GPS</div>

    <button id="locationButton" class="gray" disabled>
      รับตำแหน่ง GPS
    </button>

    <div id="locationInfo" class="info">
      ยังไม่ได้รับตำแหน่ง GPS
    </div>

    <a id="mapLink" class="map-link" href="#" target="_blank" rel="noopener">
      เปิดตำแหน่งใน Google Maps
    </a>

    <div class="step">ขั้นตอนที่ 2: ถ่ายรูปยืนยันตัวตน</div>

    <button id="cameraButton" class="gray" disabled>
      เปิดกล้อง
    </button>

    <video id="video" autoplay playsinline muted></video>

    <button id="captureButton" class="blue" disabled>
      ถ่ายรูป
    </button>

    <img id="photo" alt="รูปยืนยันการลงเวลา">

    <div class="step">ขั้นตอนที่ 3: บันทึกเวลา</div>

    <button id="submitButton" class="green" disabled>
      บันทึกเวลา
    </button>

    <div id="status" class="status"></div>
    <div id="result" class="result"></div>

    <div class="note">
      หมายเหตุ: กรุณากดอนุญาตการใช้ GPS และกล้องเมื่อเบราว์เซอร์ร้องขอ
    </div>

  </main>

  <script>
    // =========================
    // Google Apps Script Web App
    // =========================
    const WEB_APP_URL =
      "https://script.google.com/macros/s/AKfycbz2-c9tfqoQ8LpvlEasBByfPgZAvw92Z4pU5AQohRGMRJtjiTH6DIBJo9-PrVhFIhQ/exec";

    // =========================
    // ตัวแปรระบบ
    // =========================
    let latitude = null;
    let longitude = null;
    let accuracy = null;
    let photoBase64 = null;
    let stream = null;
    let isSubmitting = false;

    // =========================
    // DOM
    // =========================
    const consent = document.getElementById("consent");
    const employeeId = document.getElementById("employeeId");
    const employeeName = document.getElementById("employeeName");
    const action = document.getElementById("action");

    const locationButton = document.getElementById("locationButton");
    const cameraButton = document.getElementById("cameraButton");
    const captureButton = document.getElementById("captureButton");
    const submitButton = document.getElementById("submitButton");

    const locationInfo = document.getElementById("locationInfo");
    const mapLink = document.getElementById("mapLink");

    const video = document.getElementById("video");
    const photo = document.getElementById("photo");

    const status = document.getElementById("status");
    const result = document.getElementById("result");

    // =========================
    // แสดงสถานะ
    // =========================
    function showStatus(message, type) {
      status.textContent = message;
      status.className = "status " + (type || "");
    }

    // =========================
    // เปิด/ปิดช่องกรอกข้อมูล
    // =========================
    function updateFormState() {
      const enabled = consent.checked;

      employeeId.disabled = !enabled;
      employeeName.disabled = !enabled;
      action.disabled = !enabled;
      locationButton.disabled = !enabled;

      if (!enabled) {
        stopCamera();

        cameraButton.disabled = true;
        captureButton.disabled = true;
        submitButton.disabled = true;

        showStatus("กรุณายอมรับเงื่อนไขก่อนเริ่มใช้งาน", "error");
      } else {
        status.className = "status";
        checkReady();
      }
    }

    // สำคัญ:
    // เรียกทันทีเมื่อเปิดหน้าเว็บ เพื่อป้องกันกรณี Browser
    // จำสถานะ checkbox เดิม ทำให้ checkbox ติ๊กแล้วแต่ช่องยัง Disabled
    consent.addEventListener("change", updateFormState);
    updateFormState();

    // =========================
    // ตรวจสอบว่าพร้อมบันทึกหรือยัง
    // =========================
    function checkReady() {
      const ready =
        consent.checked &&
        employeeId.value.trim() !== "" &&
        employeeName.value.trim() !== "" &&
        latitude !== null &&
        longitude !== null &&
        photoBase64 !== null &&
        !isSubmitting;

      submitButton.disabled = !ready;
    }

    employeeId.addEventListener("input", checkReady);
    employeeName.addEventListener("input", checkReady);

    // =========================
    // หยุดกล้อง
    // =========================
    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.srcObject = null;
      video.style.display = "none";
      captureButton.disabled = true;
    }

    // =========================
    // GPS
    // =========================
    locationButton.addEventListener("click", function () {

      if (!navigator.geolocation) {
        showStatus("อุปกรณ์หรือเบราว์เซอร์นี้ไม่รองรับ GPS", "error");
        return;
      }

      locationButton.disabled = true;
      locationInfo.textContent = "กำลังค้นหาตำแหน่ง GPS...";
      showStatus("กำลังรับตำแหน่ง กรุณารอสักครู่", "loading");

      navigator.geolocation.getCurrentPosition(
        function (position) {

          latitude = position.coords.latitude;
          longitude = position.coords.longitude;
          accuracy = position.coords.accuracy;

          locationInfo.innerHTML =
            "<strong>ได้รับตำแหน่งแล้ว</strong><br>" +
            "Latitude: " + latitude.toFixed(6) + "<br>" +
            "Longitude: " + longitude.toFixed(6) + "<br>" +
            "ความแม่นยำประมาณ: " +
            Math.round(accuracy) + " เมตร";

          mapLink.href =
            "https://www.google.com/maps?q=" +
            latitude + "," + longitude;

          mapLink.style.display = "inline-block";

          cameraButton.disabled = false;
          locationButton.disabled = false;

          showStatus("ได้รับตำแหน่ง GPS เรียบร้อยแล้ว", "success");

          checkReady();
        },

        function (error) {

          locationButton.disabled = false;

          if (error.code === error.PERMISSION_DENIED) {
            showStatus(
              "กรุณาอนุญาตให้เว็บไซต์เข้าถึงตำแหน่ง",
              "error"
            );
          } else if (error.code === error.POSITION_UNAVAILABLE) {
            showStatus(
              "ไม่พบตำแหน่ง กรุณาตรวจสอบ GPS",
              "error"
            );
          } else if (error.code === error.TIMEOUT) {
            showStatus(
              "รับตำแหน่งใช้เวลานานเกินไป กรุณาลองใหม่",
              "error"
            );
          } else {
            showStatus(
              "ไม่สามารถรับตำแหน่งได้",
              "error"
            );
          }

          locationInfo.textContent =
            "ยังไม่ได้รับตำแหน่ง GPS";
        },
        {
          enableHighAccuracy: true,
          timeout: 20000,
          maximumAge: 0
        }
      );
    });

    // =========================
    // เปิดกล้อง
    // =========================
    cameraButton.addEventListener("click", async function () {

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {
        showStatus(
          "เบราว์เซอร์นี้ไม่รองรับการเปิดกล้อง",
          "error"
        );
        return;
      }

      try {

        stopCamera();

        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user",
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;
        video.style.display = "block";

        captureButton.disabled = false;

        showStatus(
          "เปิดกล้องแล้ว กรุณากดปุ่มถ่ายรูป",
          "success"
        );

      } catch (error) {

        console.error("Camera error:", error);

        showStatus(
          "ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตการใช้กล้อง",
          "error"
        );
      }
    });

    // =========================
    // ถ่ายรูป
    // =========================
    captureButton.addEventListener("click", function () {

      if (!video.videoWidth || !video.videoHeight) {
        showStatus(
          "กล้องยังไม่พร้อม กรุณารอสักครู่",
          "error"
        );
        return;
      }

      const canvas = document.createElement("canvas");

      // ลดขนาดรูป เพื่อไม่ให้ข้อมูลใหญ่เกินไปตอนส่งไป Apps Script
      const maxWidth = 1000;
      const scale = Math.min(
        1,
        maxWidth / video.videoWidth
      );

      canvas.width = Math.round(video.videoWidth * scale);
      canvas.height = Math.round(video.videoHeight * scale);

      const context = canvas.getContext("2d");

      context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );

      photoBase64 = canvas.toDataURL(
        "image/jpeg",
        0.75
      );

      photo.src = photoBase64;
      photo.style.display = "block";

      stopCamera();

      showStatus(
        "ถ่ายรูปเรียบร้อยแล้ว",
        "success"
      );

      checkReady();
    });

    // =========================
    // ส่งข้อมูลไป Google Sheets
    // =========================
    submitButton.addEventListener("click", async function () {

      if (isSubmitting) {
        return;
      }

      if (
        !employeeId.value.trim() ||
        !employeeName.value.trim()
      ) {
        showStatus(
          "กรุณากรอกรหัสพนักงานและชื่อ-นามสกุล",
          "error"
        );
        return;
      }

      if (
        latitude === null ||
        longitude === null
      ) {
        showStatus(
          "กรุณารับตำแหน่ง GPS ก่อน",
          "error"
        );
        return;
      }

      if (!photoBase64) {
        showStatus(
          "กรุณาถ่ายรูปก่อนบันทึกเวลา",
          "error"
        );
        return;
      }

      isSubmitting = true;
      submitButton.disabled = true;

      showStatus(
        "กำลังบันทึกข้อมูล กรุณารอสักครู่...",
        "loading"
      );

      /*
        ใช้ URLSearchParams แทน JSON

        เหตุผล:
        Google Apps Script สามารถรับข้อมูลผ่าน e.parameter
        ได้โดยตรง และไม่ต้องอ่าน response จาก no-cors
      */
      const formData = new URLSearchParams();

      formData.append(
        "employeeId",
        employeeId.value.trim()
      );

      formData.append(
        "employeeName",
        employeeName.value.trim()
      );

      formData.append(
        "action",
        action.value
      );

      formData.append(
        "latitude",
        latitude
      );

      formData.append(
        "longitude",
        longitude
      );

      formData.append(
        "accuracy",
        Math.round(accuracy || 0)
      );

      formData.append(
        "photoBase64",
        photoBase64
      );

      try {

        await fetch(WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",
          body: formData
        });

        /*
          no-cors ไม่สามารถอ่าน response จาก Apps Script ได้
          ดังนั้นตรงนี้หมายถึง Request ถูกส่งออกไปแล้ว
        */

        showStatus(
          "ส่งข้อมูลไปยัง Google Sheets แล้ว",
          "success"
        );

        result.style.display = "block";

        result.innerHTML =
          "<strong>ข้อมูลลงเวลาที่ส่ง</strong><br>" +
          "รหัสพนักงาน: " +
          escapeHtml(employeeId.value.trim()) +
          "<br>" +
          "ชื่อ: " +
          escapeHtml(employeeName.value.trim()) +
          "<br>" +
          "ประเภท: " +
          escapeHtml(action.value) +
          "<br>" +
          "เวลา: " +
          new Date().toLocaleString("th-TH") +
          "<br>" +
          "พิกัด: " +
          Number(latitude).toFixed(6) +
          ", " +
          Number(longitude).toFixed(6) +
          "<br>" +
          "ความแม่นยำ: " +
          Math.round(accuracy || 0) +
          " เมตร";

        // ล้างข้อมูลหลังส่ง
        employeeId.value = "";
        employeeName.value = "";

        latitude = null;
        longitude = null;
        accuracy = null;
        photoBase64 = null;

        photo.src = "";
        photo.style.display = "none";

        mapLink.style.display = "none";

        locationInfo.textContent =
          "ยังไม่ได้รับตำแหน่ง GPS";

        checkReady();

      } catch (error) {

        console.error(
          "Google Apps Script Error:",
          error
        );

        showStatus(
          "ไม่สามารถส่งข้อมูลได้ กรุณาตรวจสอบ Web App URL และการ Deploy",
          "error"
        );

      } finally {

        isSubmitting = false;
        checkReady();
      }
    });

    // =========================
    // ป้องกัน HTML injection ในผลลัพธ์
    // =========================
    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // =========================
    // ปิดกล้องเมื่อออกจากหน้า
    // =========================
    window.addEventListener(
      "beforeunload",
      stopCamera
    );
  </script>
</body>
</html>
