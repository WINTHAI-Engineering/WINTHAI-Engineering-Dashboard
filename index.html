<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบลงเวลาเข้า-ออกงาน</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      background: linear-gradient(135deg, #eaf2ff, #f7f9fc);
      color: #1d2939;
      font-family: Arial, "Segoe UI", "Microsoft JhengHei", "Noto Sans Thai", sans-serif;
    }

    .container {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 26px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(16, 24, 40, .12);
    }

    .topbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 8px;
    }

    .language-switch {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      background: #f2f4f7;
      border-radius: 10px;
    }

    .language-switch button {
      width: auto;
      min-width: 72px;
      min-height: 38px;
      padding: 7px 12px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #475467;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .language-switch button.active {
      background: #155eef;
      color: #fff;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 25px;
      color: #155eef;
    }

    .subtitle {
      margin: 10px 0 24px;
      text-align: center;
      color: #667085;
      font-size: 14px;
    }

    .consent {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 14px;
      border: 1px solid #fedf89;
      border-radius: 12px;
      background: #fffaeb;
      font-size: 13px;
      line-height: 1.6;
      color: #7a2e0e;
    }

    .consent input {
      width: 20px;
      height: 20px;
      margin: 2px 0 0;
      flex-shrink: 0;
      cursor: pointer;
    }

    .consent label {
      margin: 0;
      cursor: pointer;
      font-weight: normal;
    }

    label.field-label {
      display: block;
      margin: 18px 0 7px;
      font-size: 14px;
      font-weight: 700;
      color: #344054;
    }

    input[type="text"],
    select,
    .main-button {
      width: 100%;
      min-height: 50px;
      border-radius: 11px;
      font-size: 16px;
    }

    input[type="text"],
    select {
      padding: 12px 14px;
      border: 1px solid #d0d5dd;
      outline: none;
      background: #fff;
      color: #1d2939;
    }

    input[type="text"]:focus,
    select:focus {
      border-color: #155eef;
      box-shadow: 0 0 0 4px rgba(21, 94, 239, .12);
    }

    input[type="text"]:disabled,
    select:disabled {
      background: #f2f4f7;
      color: #98a2b3;
      cursor: not-allowed;
    }

    .step {
      margin: 26px 0 9px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eaecf0;
      font-size: 15px;
      font-weight: 700;
      color: #475467;
    }

    .main-button {
      padding: 12px 16px;
      border: 0;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      transition: filter .2s, transform .1s;
    }

    .main-button:hover:not(:disabled) {
      filter: brightness(.96);
    }

    .main-button:active:not(:disabled) {
      transform: scale(.99);
    }

    .blue { background: #155eef; }
    .gray { background: #475467; }
    .green { background: #039855; }

    .info,
    .status,
    .result {
      margin-top: 11px;
      padding: 13px;
      border-radius: 11px;
      font-size: 13px;
      line-height: 1.6;
    }

    .info {
      background: #eff8ff;
      color: #175cd3;
    }

    .status {
      display: none;
    }

    .status.success {
      display: block;
      background: #ecfdf3;
      color: #027a48;
    }

    .status.error {
      display: block;
      background: #fef3f2;
      color: #b42318;
    }

    .status.loading {
      display: block;
      background: #fffaeb;
      color: #b54708;
    }

    #video,
    #photo {
      display: none;
      width: 100%;
      margin-top: 12px;
      border-radius: 12px;
      background: #101828;
    }

    #video {
      max-height: 420px;
      object-fit: cover;
    }

    .map-link {
      display: none;
      margin-top: 10px;
      color: #155eef;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }

    .map-link:hover {
      text-decoration: underline;
    }

    .result {
      display: none;
      border: 1px solid #abefc6;
      background: #f6fef9;
      color: #027a48;
    }

    .note {
      margin-top: 10px;
      color: #667085;
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .container {
        padding: 18px;
        border-radius: 16px;
      }

      h1 {
        font-size: 22px;
      }

      .language-switch button {
        min-width: 64px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <div class="topbar">
      <div class="language-switch">
        <button id="langTH" type="button" onclick="setLanguage('th')">ไทย</button>
        <button id="langZH" type="button" onclick="setLanguage('zh')">中文</button>
      </div>
    </div>

    <h1 id="title">ระบบลงเวลาเข้า-ออกงาน</h1>
    <p class="subtitle" id="subtitle">
      กรอกข้อมูล รับตำแหน่ง และถ่ายรูปก่อนบันทึกเวลา
    </p>

    <div class="consent">
      <input type="checkbox" id="consent">
      <label for="consent" id="consentText">
        ฉันยินยอมให้ระบบเข้าถึงตำแหน่ง GPS และกล้อง
        เพื่อใช้ยืนยันการลงเวลาทำงาน
      </label>
    </div>

    <label class="field-label" for="employeeId" id="employeeIdLabel">รหัสพนักงาน</label>
    <input id="employeeId" type="text" placeholder="เช่น EMP001" disabled>

    <label class="field-label" for="employeeName" id="employeeNameLabel">ชื่อ-นามสกุล</label>
    <input id="employeeName" type="text" placeholder="กรอกชื่อ-นามสกุล" disabled>

    <label class="field-label" for="action" id="actionLabel">ประเภทการลงเวลา</label>
    <select id="action" disabled>
      <!-- value ต้องเป็นภาษาไทย เพื่อให้ Backend เดิมทำงานเหมือนเดิม -->
      <option value="เข้างาน" id="actionIn">เข้างาน</option>
      <option value="ออกงาน" id="actionOut">ออกงาน</option>
    </select>

    <div class="step" id="stepGPS">ขั้นตอนที่ 1: ตรวจสอบตำแหน่ง GPS</div>

    <button id="locationButton" class="main-button gray" disabled>
      รับตำแหน่ง GPS
    </button>

    <div id="locationInfo" class="info">
      ยังไม่ได้รับตำแหน่ง GPS
    </div>

    <a id="mapLink" class="map-link" href="#" target="_blank" rel="noopener">
      เปิดตำแหน่งใน Google Maps
    </a>

    <div class="step" id="stepCamera">ขั้นตอนที่ 2: ถ่ายรูปยืนยันตัวตน</div>

    <button id="cameraButton" class="main-button gray" disabled>
      เปิดกล้อง
    </button>

    <video id="video" autoplay playsinline muted></video>

    <button id="captureButton" class="main-button blue" disabled>
      ถ่ายรูป
    </button>

    <img id="photo" alt="รูปยืนยันการลงเวลา">

    <div class="step" id="stepSubmit">ขั้นตอนที่ 3: บันทึกเวลา</div>

    <button id="submitButton" class="main-button green" disabled>
      บันทึกเวลา
    </button>

    <div id="status" class="status"></div>
    <div id="result" class="result"></div>

    <div class="note" id="note">
      หมายเหตุ: กรุณากดอนุญาตการใช้ GPS และกล้องเมื่อเบราว์เซอร์ร้องขอ
    </div>

  </main>

  <script>
    // =====================================================
    // Google Apps Script Web App URL
    // ใช้ URL เดิมของระบบคุณ
    // =====================================================
    const WEB_APP_URL =
      "https://script.google.com/macros/s/AKfycbzoGWeJ9o7XRqQJOZgIc7WNirr9kMRrOrKvEhBpxQVPT2SYT9xhou0GWApgAdatGH8/exec";

    // =====================================================
    // ตัวแปรระบบ
    // =====================================================
    let latitude = null;
    let longitude = null;
    let accuracy = null;
    let photoBase64 = null;
    let stream = null;
    let isSubmitting = false;

    // =====================================================
    // ภาษา
    // =====================================================
    const translations = {
      th: {
        title: "ระบบลงเวลาเข้า-ออกงาน",
        subtitle: "กรอกข้อมูล รับตำแหน่ง และถ่ายรูปก่อนบันทึกเวลา",
        consent: "ฉันยินยอมให้ระบบเข้าถึงตำแหน่ง GPS และกล้อง เพื่อใช้ยืนยันการลงเวลาทำงาน",
        employeeIdLabel: "รหัสพนักงาน",
        employeeIdPlaceholder: "เช่น EMP001",
        employeeNameLabel: "ชื่อ-นามสกุล",
        employeeNamePlaceholder: "กรอกชื่อ-นามสกุล",
        actionLabel: "ประเภทการลงเวลา",
        actionIn: "เข้างาน",
        actionOut: "ออกงาน",
        stepGPS: "ขั้นตอนที่ 1: ตรวจสอบตำแหน่ง GPS",
        getGPS: "รับตำแหน่ง GPS",
        gpsNotReceived: "ยังไม่ได้รับตำแหน่ง GPS",
        openMap: "เปิดตำแหน่งใน Google Maps",
        stepCamera: "ขั้นตอนที่ 2: ถ่ายรูปยืนยันตัวตน",
        openCamera: "เปิดกล้อง",
        takePhoto: "ถ่ายรูป",
        stepSubmit: "ขั้นตอนที่ 3: บันทึกเวลา",
        submit: "บันทึกเวลา",
        note: "หมายเหตุ: กรุณากดอนุญาตการใช้ GPS และกล้องเมื่อเบราว์เซอร์ร้องขอ",

        consentRequired: "กรุณายอมรับเงื่อนไขก่อนเริ่มใช้งาน",
        gpsUnsupported: "อุปกรณ์หรือเบราว์เซอร์นี้ไม่รองรับ GPS",
        gpsSearching: "กำลังค้นหาตำแหน่ง GPS...",
        gpsLoading: "กำลังรับตำแหน่ง กรุณารอสักครู่",
        gpsReceived: "ได้รับตำแหน่งแล้ว",
        accuracy: "ความแม่นยำประมาณ",
        meters: "เมตร",
        gpsSuccess: "ได้รับตำแหน่ง GPS เรียบร้อยแล้ว",
        gpsPermission: "กรุณาอนุญาตให้เว็บไซต์เข้าถึงตำแหน่ง",
        gpsUnavailable: "ไม่พบตำแหน่ง กรุณาตรวจสอบ GPS",
        gpsTimeout: "รับตำแหน่งใช้เวลานานเกินไป กรุณาลองใหม่",
        gpsError: "ไม่สามารถรับตำแหน่งได้",

        cameraUnsupported: "เบราว์เซอร์นี้ไม่รองรับการเปิดกล้อง",
        cameraOpened: "เปิดกล้องแล้ว กรุณากดปุ่มถ่ายรูป",
        cameraPermission: "ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตการใช้กล้อง",
        cameraNotReady: "กล้องยังไม่พร้อม กรุณารอสักครู่",
        photoSuccess: "ถ่ายรูปเรียบร้อยแล้ว",

        missingEmployee: "กรุณากรอกรหัสพนักงานและชื่อ-นามสกุล",
        missingGPS: "กรุณารับตำแหน่ง GPS ก่อน",
        missingPhoto: "กรุณาถ่ายรูปก่อนบันทึกเวลา",
        saving: "กำลังบันทึกข้อมูล กรุณารอสักครู่...",
        sent: "ส่งข้อมูลไปยัง Google Sheets แล้ว",
        resultTitle: "ข้อมูลลงเวลาที่ส่ง",
        resultEmployeeId: "รหัสพนักงาน",
        resultName: "ชื่อ",
        resultAction: "ประเภท",
        resultTime: "เวลา",
        resultCoordinates: "พิกัด",
        resultAccuracy: "ความแม่นยำ",
        sendError: "ไม่สามารถส่งข้อมูลได้ กรุณาตรวจสอบ Web App URL และการ Deploy",
        receivedLocation: "ได้รับตำแหน่งแล้ว"
      },

      zh: {
        title: "上下班打卡系统",
        subtitle: "填写资料、取得 GPS 位置并拍照后即可打卡",
        consent: "我同意系统使用 GPS 位置和相机，以确认员工打卡",
        employeeIdLabel: "员工编号",
        employeeIdPlaceholder: "例如 EMP001",
        employeeNameLabel: "姓名",
        employeeNamePlaceholder: "请输入姓名",
        actionLabel: "打卡类型",
        actionIn: "上班",
        actionOut: "下班",
        stepGPS: "步骤 1：确认 GPS 位置",
        getGPS: "取得 GPS 位置",
        gpsNotReceived: "尚未取得 GPS 位置",
        openMap: "在 Google 地图中查看位置",
        stepCamera: "步骤 2：拍照确认身份",
        openCamera: "打开相机",
        takePhoto: "拍照",
        stepSubmit: "步骤 3：提交打卡",
        submit: "提交打卡",
        note: "注意：浏览器要求时，请允许使用 GPS 位置和相机",

        consentRequired: "请先同意使用条款",
        gpsUnsupported: "此设备或浏览器不支持 GPS",
        gpsSearching: "正在寻找 GPS 位置……",
        gpsLoading: "正在取得位置，请稍候",
        gpsReceived: "已取得位置",
        accuracy: "预计精度",
        meters: "米",
        gpsSuccess: "GPS 位置取得成功",
        gpsPermission: "请允许网站访问您的位置",
        gpsUnavailable: "无法取得位置，请检查 GPS",
        gpsTimeout: "取得位置超时，请重新尝试",
        gpsError: "无法取得位置",

        cameraUnsupported: "此浏览器不支持开启相机",
        cameraOpened: "相机已开启，请按拍照按钮",
        cameraPermission: "无法开启相机，请允许使用相机",
        cameraNotReady: "相机尚未准备好，请稍候",
        photoSuccess: "拍照完成",

        missingEmployee: "请输入员工编号和姓名",
        missingGPS: "请先取得 GPS 位置",
        missingPhoto: "请先拍照后再提交打卡",
        saving: "正在保存资料，请稍候……",
        sent: "资料已发送到 Google Sheets",
        resultTitle: "已提交的打卡资料",
        resultEmployeeId: "员工编号",
        resultName: "姓名",
        resultAction: "类型",
        resultTime: "时间",
        resultCoordinates: "坐标",
        resultAccuracy: "精度",
        sendError: "无法发送资料，请检查 Web App URL 和部署设置",
        receivedLocation: "位置已取得"
      }
    };

    let currentLanguage = localStorage.getItem("attendanceLanguage") || "th";

    function t(key) {
      return translations[currentLanguage][key] || translations.th[key] || key;
    }

    function setLanguage(lang) {
      if (!translations[lang]) return;

      currentLanguage = lang;
      localStorage.setItem("attendanceLanguage", lang);
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "th";

      document.getElementById("langTH").classList.toggle("active", lang === "th");
      document.getElementById("langZH").classList.toggle("active", lang === "zh");

      applyTranslations();
      updateDynamicTexts();
    }

    function applyTranslations() {
      document.getElementById("title").textContent = t("title");
      document.getElementById("subtitle").textContent = t("subtitle");
      document.getElementById("consentText").textContent = t("consent");

      document.getElementById("employeeIdLabel").textContent = t("employeeIdLabel");
      document.getElementById("employeeId").placeholder = t("employeeIdPlaceholder");

      document.getElementById("employeeNameLabel").textContent = t("employeeNameLabel");
      document.getElementById("employeeName").placeholder = t("employeeNamePlaceholder");

      document.getElementById("actionLabel").textContent = t("actionLabel");
      document.getElementById("actionIn").textContent = t("actionIn");
      document.getElementById("actionOut").textContent = t("actionOut");

      document.getElementById("stepGPS").textContent = t("stepGPS");
      document.getElementById("locationButton").textContent = t("getGPS");

      document.getElementById("stepCamera").textContent = t("stepCamera");
      document.getElementById("cameraButton").textContent = t("openCamera");
      document.getElementById("captureButton").textContent = t("takePhoto");

      document.getElementById("stepSubmit").textContent = t("stepSubmit");
      document.getElementById("submitButton").textContent = t("submit");

      document.getElementById("note").textContent = t("note");

      if (latitude === null || longitude === null) {
        document.getElementById("locationInfo").textContent = t("gpsNotReceived");
      }

      const mapLink = document.getElementById("mapLink");
      if (mapLink.style.display !== "none") {
        mapLink.textContent = t("openMap");
      }
    }

    function updateDynamicTexts() {
      // ถ้ามีข้อความสถานะอยู่ ให้แสดงใหม่ตามภาษา
      // ไม่เปลี่ยนข้อความที่เป็นผลลัพธ์จากการส่งแล้วโดยอัตโนมัติ
    }

    // =====================================================
    // DOM
    // =====================================================
    const consent = document.getElementById("consent");
    const employeeId = document.getElementById("employeeId");
    const employeeName = document.getElementById("employeeName");
    const action = document.getElementById("action");

    const locationButton = document.getElementById("locationButton");
    const cameraButton = document.getElementById("cameraButton");
    const captureButton = document.getElementById("captureButton");
    const submitButton = document.getElementById("submitButton");

    const locationInfo = document.getElementById("locationInfo");
    const mapLink = document.getElementById("mapLink");

    const video = document.getElementById("video");
    const photo = document.getElementById("photo");

    const status = document.getElementById("status");
    const result = document.getElementById("result");

    // =====================================================
    // แสดงสถานะ
    // =====================================================
    function showStatus(message, type) {
      status.textContent = message;
      status.className = "status " + (type || "");
    }

    // =====================================================
    // เปิด/ปิดช่องกรอกข้อมูล
    // =====================================================
    function updateFormState() {
      const enabled = consent.checked;

      employeeId.disabled = !enabled;
      employeeName.disabled = !enabled;
      action.disabled = !enabled;
      locationButton.disabled = !enabled;

      if (!enabled) {
        stopCamera();
        cameraButton.disabled = true;
        captureButton.disabled = true;
        submitButton.disabled = true;

        showStatus(t("consentRequired"), "error");
      } else {
        status.className = "status";
        checkReady();
      }
    }

    consent.addEventListener("change", updateFormState);

    // =====================================================
    // ตรวจสอบว่าพร้อมบันทึกหรือยัง
    // =====================================================
    function checkReady() {
      const ready =
        consent.checked &&
        employeeId.value.trim() !== "" &&
        employeeName.value.trim() !== "" &&
        latitude !== null &&
        longitude !== null &&
        photoBase64 !== null &&
        !isSubmitting;

      submitButton.disabled = !ready;
    }

    employeeId.addEventListener("input", checkReady);
    employeeName.addEventListener("input", checkReady);

    // =====================================================
    // หยุดกล้อง
    // =====================================================
    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.srcObject = null;
      video.style.display = "none";
      captureButton.disabled = true;
    }

    // =====================================================
    // GPS
    // =====================================================
    locationButton.addEventListener("click", function () {

      if (!navigator.geolocation) {
        showStatus(t("gpsUnsupported"), "error");
        return;
      }

      locationButton.disabled = true;
      locationInfo.textContent = t("gpsSearching");
      showStatus(t("gpsLoading"), "loading");

      navigator.geolocation.getCurrentPosition(
        function (position) {

          latitude = position.coords.latitude;
          longitude = position.coords.longitude;
          accuracy = position.coords.accuracy;

          locationInfo.innerHTML =
            "<strong>" + escapeHtml(t("gpsReceived")) + "</strong><br>" +
            "Latitude: " + latitude.toFixed(6) + "<br>" +
            "Longitude: " + longitude.toFixed(6) + "<br>" +
            escapeHtml(t("accuracy")) + ": " +
            Math.round(accuracy) + " " + escapeHtml(t("meters"));

          mapLink.href =
            "https://www.google.com/maps?q=" +
            latitude + "," + longitude;

          mapLink.textContent = t("openMap");
          mapLink.style.display = "inline-block";

          cameraButton.disabled = false;
          locationButton.disabled = false;

          showStatus(t("gpsSuccess"), "success");

          checkReady();
        },

        function (error) {

          locationButton.disabled = false;

          if (error.code === error.PERMISSION_DENIED) {
            showStatus(t("gpsPermission"), "error");
          } else if (error.code === error.POSITION_UNAVAILABLE) {
            showStatus(t("gpsUnavailable"), "error");
          } else if (error.code === error.TIMEOUT) {
            showStatus(t("gpsTimeout"), "error");
          } else {
            showStatus(t("gpsError"), "error");
          }

          locationInfo.textContent = t("gpsNotReceived");
        },

        {
          enableHighAccuracy: true,
          timeout: 20000,
          maximumAge: 0
        }
      );
    });

    // =====================================================
    // เปิดกล้อง
    // =====================================================
    cameraButton.addEventListener("click", async function () {

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {
        showStatus(t("cameraUnsupported"), "error");
        return;
      }

      try {

        stopCamera();

        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user",
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;
        video.style.display = "block";

        captureButton.disabled = false;

        showStatus(t("cameraOpened"), "success");

      } catch (error) {

        console.error("Camera error:", error);

        showStatus(t("cameraPermission"), "error");
      }
    });

    // =====================================================
    // ถ่ายรูป
    // =====================================================
    captureButton.addEventListener("click", function () {

      if (!video.videoWidth || !video.videoHeight) {
        showStatus(t("cameraNotReady"), "error");
        return;
      }

      const canvas = document.createElement("canvas");

      // ลดขนาดรูป เพื่อไม่ให้ข้อมูลใหญ่เกินไปตอนส่งไป Apps Script
      const maxWidth = 1000;

      const scale = Math.min(
        1,
        maxWidth / video.videoWidth
      );

      canvas.width = Math.round(video.videoWidth * scale);
      canvas.height = Math.round(video.videoHeight * scale);

      const context = canvas.getContext("2d");

      context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );

      photoBase64 = canvas.toDataURL(
        "image/jpeg",
        0.75
      );

      photo.src = photoBase64;
      photo.style.display = "block";

      stopCamera();

      showStatus(t("photoSuccess"), "success");

      checkReady();
    });

    // =====================================================
    // ส่งข้อมูลไป Google Sheets
    // =====================================================
    submitButton.addEventListener("click", async function () {

      if (isSubmitting) {
        return;
      }

      if (
        !employeeId.value.trim() ||
        !employeeName.value.trim()
      ) {
        showStatus(t("missingEmployee"), "error");
        return;
      }

      if (
        latitude === null ||
        longitude === null
      ) {
        showStatus(t("missingGPS"), "error");
        return;
      }

      if (!photoBase64) {
        showStatus(t("missingPhoto"), "error");
        return;
      }

      isSubmitting = true;
      submitButton.disabled = true;

      showStatus(t("saving"), "loading");

      /*
        ใช้ URLSearchParams แทน JSON

        Backend เดิมของ Google Apps Script
        รับข้อมูลผ่าน e.parameter ได้โดยตรง
      */
      const formData = new URLSearchParams();

      formData.append(
        "employeeId",
        employeeId.value.trim()
      );

      formData.append(
        "employeeName",
        employeeName.value.trim()
      );

      // ค่าที่ส่งไป Backend ยังคงเป็น "เข้างาน"/"ออกงาน"
      // แม้หน้าจอจะแสดงเป็นภาษาจีน
      formData.append(
        "action",
        action.value
      );

      formData.append(
        "latitude",
        latitude
      );

      formData.append(
        "longitude",
        longitude
      );

      formData.append(
        "accuracy",
        Math.round(accuracy || 0)
      );

      formData.append(
        "photoBase64",
        photoBase64
      );

      try {

        await fetch(WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",
          body: formData
        });

        showStatus(t("sent"), "success");

        result.style.display = "block";

        const actionText =
          action.value === "เข้างาน"
            ? t("actionIn")
            : t("actionOut");

        result.innerHTML =
          "<strong>" + escapeHtml(t("resultTitle")) + "</strong><br>" +
          escapeHtml(t("resultEmployeeId")) + ": " +
          escapeHtml(employeeId.value.trim()) +
          "<br>" +
          escapeHtml(t("resultName")) + ": " +
          escapeHtml(employeeName.value.trim()) +
          "<br>" +
          escapeHtml(t("resultAction")) + ": " +
          escapeHtml(actionText) +
          "<br>" +
          escapeHtml(t("resultTime")) + ": " +
          new Date().toLocaleString(
            currentLanguage === "zh" ? "zh-CN" : "th-TH"
          ) +
          "<br>" +
          escapeHtml(t("resultCoordinates")) + ": " +
          Number(latitude).toFixed(6) +
          ", " +
          Number(longitude).toFixed(6) +
          "<br>" +
          escapeHtml(t("resultAccuracy")) + ": " +
          Math.round(accuracy || 0) +
          " " +
          escapeHtml(t("meters"));

        // ล้างข้อมูลหลังส่ง
        employeeId.value = "";
        employeeName.value = "";

        latitude = null;
        longitude = null;
        accuracy = null;
        photoBase64 = null;

        photo.src = "";
        photo.style.display = "none";

        mapLink.style.display = "none";

        locationInfo.textContent = t("gpsNotReceived");

        checkReady();

      } catch (error) {

        console.error(
          "Google Apps Script Error:",
          error
        );

        showStatus(t("sendError"), "error");

      } finally {

        isSubmitting = false;
        checkReady();
      }
    });

    // =====================================================
    // ป้องกัน HTML injection
    // =====================================================
    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // =====================================================
    // ปิดกล้องเมื่อออกจากหน้า
    // =====================================================
    window.addEventListener(
      "beforeunload",
      stopCamera
    );

    // =====================================================
    // เริ่มต้นระบบ
    // =====================================================
    setLanguage(currentLanguage);
    updateFormState();
  </script>
</body>
</html>
